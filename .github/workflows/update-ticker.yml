name: Update ticker tape

on:
  schedule:
    # Every 30 min, every day, all day -- runs continuously instead of only
    # during weekday market hours, so the tape never sits stuck on a stale
    # snapshot over nights/weekends (prices just won't move while markets
    # are closed, but "updated_at" and the tape itself stay live).
    - cron: "0,30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-ticker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yfinance

      - run: python scripts/fetch_ticker.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ticker.json
          git diff --cached --quiet || git commit -m "Update ticker tape data [skip ci]"
          git push
# registered on go-live
