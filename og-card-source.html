<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
:root{
  --bg:#0c0d10;--bg2:#131519;--border:#282b32;
  --accent:#e8a33d;--accent2:#4fb8a6;
  --text:#f2f0ea;--muted:#8b8d94;--dim:#1c1e24;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:
    radial-gradient(ellipse 700px 500px at 12% -15%, rgba(232,163,61,.14), transparent 60%),
    radial-gradient(ellipse 600px 500px at 105% 20%, rgba(79,184,166,.12), transparent 55%),
    radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px) 0 0/26px 26px,
    var(--bg);
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
  position:relative;
}
.frame{position:absolute;inset:40px;border:1px solid var(--border);border-radius:14px}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 96px}
.mark{
  width:88px;height:88px;border-radius:16px;background:var(--dim);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;margin-bottom:40px;
  font-family:'Consolas','Courier New',monospace;font-weight:800;font-size:34px;color:var(--accent);
}
.eyebrow{font-family:'Consolas','Courier New',monospace;font-size:20px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;font-weight:700;margin-bottom:26px}
h1{font-size:96px;font-weight:800;color:var(--accent);font-style:italic;letter-spacing:-2px;margin-bottom:26px;font-family:'Georgia','Charter',serif}
.rule{width:96px;height:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;margin-bottom:32px}
p{font-size:30px;color:var(--muted);max-width:820px;line-height:1.5;font-family:'Georgia','Charter',serif}
</style></head>
<body>
<div class="frame"></div>
<div class="wrap">
  <div class="mark">YR</div>
  <div class="eyebrow">Markets &times; Applied Engineering</div>
  <h1>YR Hub</h1>
  <div class="rule"></div>
  <p>A working portfolio: live tools, research instruments, and projects still in progress.</p>
</div>
</body></html>
