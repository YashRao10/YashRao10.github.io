<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
:root{
  --bg:#0c0d10;--bg2:#131519;--border:#282b32;
  --accent:#e8a33d;--accent2:#4fb8a6;
  --text:#f2f0ea;--muted:#8b8d94;--dim:#1c1e24;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:
    radial-gradient(ellipse 700px 500px at 12% -15%, rgba(232,163,61,.14), transparent 60%),
    radial-gradient(ellipse 600px 500px at 105% 20%, rgba(79,184,166,.12), transparent 55%),
    radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px) 0 0/26px 26px,
    var(--bg);
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
  position:relative;
}
.frame{position:absolute;inset:40px;border:1px solid var(--border);border-radius:14px}
.wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 96px}
.mark{
  width:72px;height:72px;border-radius:16px;background:var(--dim);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;margin-bottom:26px;
  font-family:'Consolas','Courier New',monospace;font-weight:800;font-size:28px;color:var(--accent);
}
.eyebrow{font-family:'Consolas','Courier New',monospace;font-size:20px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;font-weight:700;margin-bottom:18px}
h1{font-size:84px;font-weight:800;color:var(--accent);font-style:italic;letter-spacing:-2px;margin-bottom:26px;font-family:'Georgia','Charter',serif}
.rule{width:96px;height:5px;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;margin-bottom:32px}
p{font-size:26px;color:var(--muted);max-width:820px;line-height:1.45;font-family:'Georgia','Charter',serif}
.feat{display:flex;gap:18px;margin-top:30px}
.f{flex:1;border:1px solid var(--accent);border-radius:10px;padding:16px 20px;background:var(--bg2)}
.f .t{font-family:'Georgia','Charter',serif;font-size:22px;color:var(--text);font-weight:700;margin-bottom:6px}
.f .s{font-family:'Consolas','Courier New',monospace;font-size:17px;color:var(--muted)}
.f .s b{color:var(--accent);font-size:24px;margin-right:8px}
</style></head>
<body>
<div class="frame"></div>
<div class="wrap">
  <div class="mark">YR</div>
  <div class="eyebrow">Markets &times; Applied Engineering</div>
  <h1>YR Hub</h1>
  <div class="rule"></div>
  <p>A working portfolio: live tools, research instruments, and projects still in progress.</p>
  <div class="feat">
    <div class="f"><div class="t">Connectivity Cost Index</div><div class="s"><b>51/51</b>states where Starlink beats 5G home</div></div>
    <div class="f"><div class="t">spec-conformance-evals</div><div class="s"><b>85.2%</b>spec conformance, 330 samples</div></div>
  </div>
</div>
</body></html>
