<style>
:root{
  --bg:#0c0d10;--bg2:#131519;--card:#16181d;--border:#282b32;
  --accent:#e8a33d;--accent2:#4fb8a6;--green:#4fb8a6;--yellow:#e8a33d;
  --text:#f2f0ea;--muted:#8b8d94;--dim:#1c1e24;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(232,163,61,.08), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 15%, rgba(79,184,166,.07), transparent 55%),
    radial-gradient(ellipse 900px 600px at 85% 95%, rgba(232,163,61,.05), transparent 60%),
    radial-gradient(ellipse 700px 500px at 0% 75%, rgba(79,184,166,.05), transparent 55%),
    radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px) 0 0/26px 26px,
    var(--bg);
  color:var(--text);min-height:100vh;
  font-family:'Iowan Old Style','Georgia','Charter',serif;font-weight:400;
  overflow-x:hidden;
}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:72px 24px 64px}

.bg-decor{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.bg-chart-line{opacity:.3;filter:drop-shadow(0 0 10px rgba(79,184,166,.18))}
.bg-circuit{stroke:var(--accent);stroke-width:1.5;fill:none;opacity:.24}
.bg-circuit circle{fill:var(--accent)}

.hero{margin-bottom:40px}
.hero-eyebrow{font-family:'Consolas','Courier New',monospace;font-size:11px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;font-weight:700;margin-bottom:22px}
.hero h1{
  font-size:clamp(42px,7vw,78px);font-weight:600;letter-spacing:-1.5px;
  line-height:1.02;margin-bottom:28px;font-family:'Iowan Old Style','Georgia','Charter',serif;
}
.hero h1 span{color:var(--accent);font-style:italic}
.hero-rule{width:64px;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));margin-bottom:28px;border-radius:2px}
.hero p{font-size:16px;color:var(--muted);line-height:1.85;max-width:660px;font-family:-apple-system,'Segoe UI',system-ui,sans-serif}
.hero p strong{color:var(--text)}
.hero-note{margin-top:16px;font-size:12.5px;color:var(--muted);border-left:2px solid var(--border);padding-left:14px;max-width:620px;font-family:-apple-system,'Segoe UI',system-ui,sans-serif;line-height:1.7}

.section-label{
  display:flex;align-items:baseline;gap:12px;
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
  font-size:13px;letter-spacing:3px;color:var(--text);text-transform:uppercase;font-weight:700;
  margin:56px 0 20px;padding-bottom:14px;border-bottom:1px solid var(--border);
}
.section-label .num{font-family:'Consolas','Courier New',monospace;color:var(--accent);font-size:13px;letter-spacing:0}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;font-family:-apple-system,'Segoe UI',system-ui,sans-serif}

.tile{
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:20px 18px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;
  cursor:pointer;transition:border-color .15s,background .15s,transform .15s;position:relative;
}
.tile:hover{border-color:var(--accent);background:var(--bg2);transform:translateY(-2px)}
.tile:hover .tile-plus{border-color:var(--accent);color:var(--accent)}
.tile-mark{
  width:42px;height:42px;border-radius:7px;background:var(--dim);
  display:flex;align-items:center;justify-content:center;
  font-family:'Consolas','Courier New',monospace;font-weight:800;font-size:13px;color:var(--accent);letter-spacing:.3px;
}
.tile-title{font-size:16px;font-weight:700;color:var(--text);letter-spacing:.1px;font-family:'Iowan Old Style','Georgia','Charter',serif;line-height:1.25}
.tile-hook{font-size:12px;color:var(--muted);line-height:1.5}
.tile-badge{font-family:'Consolas','Courier New',monospace;font-size:8.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:700;padding:3px 7px;border-radius:3px;white-space:nowrap}
.badge-live{background:var(--green);color:#0c0d10;border:1px solid var(--green)}
.badge-research{background:var(--accent);color:#0c0d10;border:1px solid var(--accent)}
.badge-progress{background:none;color:var(--muted);border:1px solid var(--border)}
.tile-plus{
  position:absolute;top:16px;right:16px;width:22px;height:22px;border-radius:50%;
  border:1px solid var(--border);color:var(--muted);display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;transition:border-color .15s,color .15s;
}

.sub-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;font-family:-apple-system,'Segoe UI',system-ui,sans-serif}
.sub-link{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:3px;padding:5px 10px;text-decoration:none;transition:color .15s,border-color .15s}
.sub-link:hover{color:var(--accent);border-color:var(--accent)}

footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--border);font-family:'Consolas','Courier New',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer a{color:var(--muted)}
footer a:hover{color:var(--accent)}

button.tile{all:unset;box-sizing:border-box;cursor:pointer;width:100%}
button.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(6,7,9,.72);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;
  opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{
  background:var(--card);border:1px solid var(--border);border-radius:6px;
  max-width:560px;width:100%;max-height:82vh;overflow-y:auto;
  padding:32px 32px 28px;position:relative;
  transform:translateY(10px) scale(.98);transition:transform .18s ease;
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
}
.modal-backdrop.open .modal{transform:translateY(0) scale(1)}
.modal-close{
  all:unset;position:absolute;top:18px;right:18px;cursor:pointer;
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  color:var(--muted);border:1px solid var(--border);border-radius:50%;font-size:15px;
  font-family:-apple-system,'Segoe UI',system-ui,sans-serif;
}
.modal-close:hover{color:var(--text);border-color:var(--accent)}
.modal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px;padding-right:32px}
.modal-title{font-size:26px;font-weight:700;color:var(--text);font-family:'Iowan Old Style','Georgia','Charter',serif;line-height:1.15}
.modal-body p{font-size:14px;color:var(--muted);line-height:1.8;margin-bottom:14px}
.modal-body p:last-of-type{margin-bottom:0}
.modal-finding{font-size:13px;color:var(--text);line-height:1.65;background:var(--dim);border-left:2px solid var(--accent2);padding:12px 14px;border-radius:3px;margin-top:16px}
.modal-finding b{color:var(--accent2)}
.modal-link{
  display:inline-flex;align-items:center;gap:6px;margin-top:22px;
  font-family:'Consolas','Courier New',monospace;font-size:12px;font-weight:700;letter-spacing:.5px;
  color:#0c0d10;background:var(--accent);padding:9px 16px;border-radius:3px;text-decoration:none;
}
.modal-link:hover{background:var(--accent2)}
@media(prefers-reduced-motion:reduce){.modal-backdrop,.modal{transition:none}}
</style>
</head>

<script>
const PROJECTS = {
  'signal-log': {
    badge:'Live · updated as trades happen', badgeClass:'badge-live',
    body:[
      "A public log of real trades and the reasoning behind them — buy, sell, or trim, with the date and the why. No dollar amounts or position sizes are ever posted; the goal is to share ideas, not let anyone reverse-engineer account size.",
      "Four tabs beyond the trade log itself: Insights (longer market-analysis posts, an earnings calendar, sector performance), Econ Briefing (rates/inflation/jobs tracking plus a hand-built market-regime classifier backtested to 1999, and an Event Study section running synthetic-control tests on macro events), and Watchlist (researched but not yet bought)."
    ],
    finding:'<b>Style:</b> mostly long-term positioning around AI infrastructure plus sector-diversification adds — not day-trading, not options.',
    link:'https://yashrao10.github.io/signal-log/', linkText:'Open the log'
  },
  'regime-classifier': {
    badge:'Rule-based + backtest', badgeClass:'badge-research',
    body:[
      "A hand-built classifier that labels the current macro regime — Hawkish Tightening, Dovish Easing, Inverted Curve/Recession Risk, Stagflation-ish, Disinflation/Goldilocks, or Neutral — off the 2s10s spread, Fed funds trend, CPI trend, and unemployment trend, then shows how all 11 GICS sector SPDRs have actually performed historically in that regime, back to 1999.",
      "Explicitly documented as a hand-built ruleset, not a peer-reviewed model — and honest about its own blind spot: it trades on a trailing 6-month window, so it can lag a real policy pivot until enough post-pivot months accumulate."
    ],
    finding:'<b>Caught its own limits:</b> a pivot-detection check was added to flag exactly this lag — then tested against a real hawkish pivot and correctly did NOT fire, because the pivot was a forward-looking dot-plot signal, not yet present in the realized-rate data the model actually sees.',
    link:'https://yashrao10.github.io/signal-log/', linkText:'See it live on Signal Log'
  },
  'causal-toolkit': {
    badge:'Synthetic control', badgeClass:'badge-research',
    body:[
      "Point it at any macro/company event and any treated ticker, and it runs an Abadie-Diamond-Hainmueller synthetic-control test to check whether the event actually caused a measurable break from a hand-picked peer group — or whether the \"effect\" is just riding a pre-existing trend.",
      "A fit-quality gate (fit-window RMSE vs. the treated unit's own volatility) runs before any verdict is trusted: above 1.0x, the report leads with a hard \"do not trust this gap\" warning instead of a confident-looking chart."
    ],
    finding:'<b>Also notable:</b> the GOOGL capex-guidance case study found the sell-off was a shared hyperscaler re-pricing move, not a GOOGL-specific punishment — MSFT\'s placebo gap was actually larger.',
    link:'causal-toolkit/index.html', linkText:'Browse case studies'
  },
  'disclosure': {
    badge:'Policy', badgeClass:'badge-progress',
    body:[
      "Nothing on this page, or on YR Signal, ever shows a dollar amount or position size — not trade sizes, not portfolio totals, not returns in absolute terms.",
      "That's deliberate. The point of publishing any of this is to share the reasoning and the method, not to let anyone reverse-engineer account size or copy a trade off exact numbers."
    ]
  },
  'factor-decomposition': {
    badge:'3-factor OLS', badgeClass:'badge-research',
    body:[
      "For each holding, daily log returns are regressed against three factors — Market (SPY), Sector-excess, and Rate-excess (TLT) — orthogonalized in sequence so each beta is a clean incremental sensitivity rather than one confounded by collinearity with the others.",
      "R² is treated as a reliability gate, not a headline number: a low R² isn't a tool failure, it's itself the finding for a name that trades on its own news rather than macro factors."
    ],
    finding:'<b>Additivity:</b> working in log returns throughout makes the split exactly additive — actual return = market + sector + rate + idiosyncratic remainder, no compounding cross-terms to reconcile.',
    link:'factor-decomposition/index.html', linkText:'Browse holdings'
  },
  'fred-nowcast': {
    badge:'Bridge-equation OLS', badgeClass:'badge-research',
    body:[
      "A GDPNow-style nowcast of current-quarter real GDP growth, built from five higher-frequency FRED leading indicators via a bridge equation — an estimate of what GDP is doing right now, rather than the quarter-old official print."
    ],
    link:'fred-nowcast/index.html', linkText:'See the current estimate'
  },
  'gpt-from-scratch': {
    badge:'Phase 1 done', badgeClass:'badge-progress',
    body:[
      "A small GPT-style decoder-only transformer, implemented from first principles in PyTorch — no nn.Transformer, no pretrained weights. The goal isn't a strong model; it's understanding every piece of the architecture underneath the LLM-based tools used daily, rather than only calling one through an API.",
      "Built by hand: a character-level tokenizer, learned token + positional embeddings, causal multi-head self-attention with a lower-triangular mask, a pre-norm residual transformer block, and autoregressive sampling with temperature/top-k."
    ],
    finding:'<b>Status:</b> Phase 1 (character-level, tiny-Shakespeare corpus) closed at val loss 1.6164. Phase 2 — BPE tokenization — is next.'
  },
  'ai-security': {
    badge:'Phase 1 built', badgeClass:'badge-progress',
    body:[
      "Applies real AI-security practice to the custom Claude Code subagents already in use elsewhere on this machine, rather than treating \"AI security\" as an abstract topic. A prompt-injection red-team harness sends a corpus of injection/jailbreak payloads to a target agent's actual, verbatim system prompt and checks whether the response indicates it complied or held the line.",
      "First target: the subagent with live trade-execution access plus routine ingestion of untrusted web content — exactly the profile that makes prompt injection a genuine risk rather than a hypothetical one. Every payload targets a specific, named rule from that agent's own system prompt."
    ],
    finding:'<b>First run:</b> 18/18 manual checks passed, and the process separately surfaced a real negation-blindness bug in an unrelated classifier.'
  },
  'consulting': {
    badge:'Confidential', badgeClass:'badge-progress',
    body:[
      "Tool-qualification consulting for an aerospace-compliance vendor — building demo projects that show full requirements-to-test traceability end to end, DO-178C style.",
      "Client and project details aren't public. This tile exists so the work is acknowledged without disclosing anything about it."
    ]
  }
};

const backdrop = document.getElementById('modalBackdrop');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalBadge = document.getElementById('modalBadge');
const modalBody = document.getElementById('modalBody');
const modalLink = document.getElementById('modalLink');
const modalClose = document.getElementById('modalClose');
let lastTrigger = null;

function openModal(key, trigger){
  const p = PROJECTS[key];
  if(!p) return;
  lastTrigger = trigger || document.activeElement;
  const titleText = document.querySelector(`[data-project="${key}"] .tile-title`).textContent;
  modalTitle.textContent = titleText;
  modalBadge.textContent = p.badge;
  modalBadge.className = 'tile-badge ' + p.badgeClass;
  modalBadge.style.cssText = 'font-size:10px;padding:4px 9px';
  modalBody.innerHTML = p.body.map(t=>`<p>${t}</p>`).join('') + (p.finding ? `<div class="modal-finding">${p.finding}</div>` : '');
  if(p.link){
    modalLink.style.display = 'inline-flex';
    modalLink.href = p.link;
    modalLink.textContent = p.linkText + ' →';
  } else {
    modalLink.style.display = 'none';
  }
  backdrop.classList.add('open');
  document.body.style.overflow = 'hidden';
  modalClose.focus();
}
function closeModal(){
  backdrop.classList.remove('open');
  document.body.style.overflow = '';
  if(lastTrigger) lastTrigger.focus();
}
function focusableInModal(){
  return Array.from(modal.querySelectorAll('button, a[href]')).filter(el=>el.offsetParent !== null);
}

document.querySelectorAll('[data-project]').forEach(el=>{
  el.addEventListener('click', ()=>openModal(el.dataset.project, el));
});
modalClose.addEventListener('click', closeModal);
backdrop.addEventListener('click', e=>{ if(e.target === backdrop) closeModal(); });
document.addEventListener('keydown', e=>{
  if(!backdrop.classList.contains('open')) return;
  if(e.key === 'Escape'){ closeModal(); return; }
  if(e.key === 'Tab'){
    const f = focusableInModal();
    if(f.length === 0) return;
    const first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});
</script>
</body>
</html>
